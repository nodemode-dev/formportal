[package]
name = "formai-core"
version = "0.15.0"
description = "The formai hub's core: the catalogue and what it offers a computer. No window, no interface."
authors = ["nodemode-ai"]
license = "GPL-3.0-only"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
