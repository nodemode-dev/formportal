name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: D-Bus headers for the keychain
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: The engine and the command line compile
        run: cargo check --locked -p formportal-core -p formportal-cli

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in formportal formportal_oc_install frontend/boot_frontend frontend/oc_install setup/build_linux_app setup/build_macos_app; do
            bash -n "$f"
          done
      - name: No em dash or emoji in tracked text
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for ch in text:
                  cp = ord(ch)
                  if cp == 0x2014 or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
