name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: ./setup/build_macos_app
            name: macos-arm64
            platform: macos
            arch: arm64
          - os: macos-15-intel
            script: ./setup/build_macos_app
            name: macos-x86_64
            platform: macos
            arch: x86_64
          - os: ubuntu-22.04
            script: ./setup/build_linux_app
            name: linux-x86_64
            platform: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            script: ./setup/build_linux_app
            name: linux-arm64
            platform: linux
            arch: arm64
          - os: windows-latest
            script: setup\build_windows_app.bat
            name: windows-x86_64
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            script: setup\build_windows_app.bat
            name: windows-arm64
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config build-essential patchelf
      - name: Updater signing, when the key is set
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ vars.FORMPORTAL_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ] && [ -n "$UPDATER_PUBKEY" ]; then
            printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$UPDATER_PUBKEY" > release-updater.json
            echo "UPDATER_ARGS=--config ../release-updater.json" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.script }} ${{ env.UPDATER_ARGS }}
      - name: Pack
        run: python3 setup/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: formportal-${{ matrix.name }}
          path: release-dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Finish
        run: python3 setup/package_release.py --finish
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          gh release create "v$version" release-dist/* --draft --title "FormPortal $version" --notes "Built by the desktop workflow from $GITHUB_SHA."
