<div class="acts">
                <span class="acts-bar" aria-hidden="true"></span>
                <button class="btn" type="button" data-act="open">Open</button>
                <button class="btn btn-primary" type="button" data-act="update">Update</button>
                <button class="btn btn-primary" type="button" data-act="install">Install</button>
                <details class="drop drop-more">
                  <summary class="icon-btn" aria-label="More actions"><svg class="ic ic-m" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5.5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor"/></svg></summary>
                  <div class="drop-panel menu">
                    <label class="drop-item menu-check"><span>Update automatically</span><input type="checkbox" class="switch" data-auto /></label>
                    <div class="menu-versions"><span class="menu-label">Other versions</span><span class="menu-pick"><select class="field" data-versions aria-label="Other versions"></select><button class="btn btn-small drop-item drop-go" type="button" data-version-go>Install</button></span></div>
                    <button class="drop-item" type="button" data-act="rollback">Go back to the version before</button>
                    <button class="drop-item menu-danger" type="button" data-act="remove">Remove from this computer</button>
                  </div>
                </details>
              </div>
