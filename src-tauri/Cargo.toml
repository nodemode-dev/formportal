[package]
name = "formportal"
version = "0.41.0"
description = "FormPortal, the Form family's app portal: a Tauri shell over formportal-core"
authors = ["nodemode-ai"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
formportal-core = { path = "../core" }
formportal-cli = { path = "../cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
