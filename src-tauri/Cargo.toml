[package]
name = "formai"
version = "0.20.0"
description = "formai, the hub for formcut, formvis and formwav: a Tauri shell over formai-core"
authors = ["nodemode-ai"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
formai-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
