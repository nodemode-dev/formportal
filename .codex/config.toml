# FormPortal for Codex in this repository (trusted projects only). From any folder: ./formportal agents install codex.
[mcp_servers.formportal]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)/formportal\" mcp"]
startup_timeout_sec = 600
tool_timeout_sec = 3600
